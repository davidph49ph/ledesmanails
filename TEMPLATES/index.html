<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LedesmaNails - Gestión de Citas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 id="brand-title" class="text-xl font-bold tracking-tight text-slate-900 flex items-center gap-2">
                <i class="fa-solid fa-wand-magic-sparkles text-pink-500"></i> LedesmaNails
            </h1>
            <button onclick="toggleAdminModal()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-full font-medium transition">
                <i class="fa-solid fa-lock mr-1"></i> Panel Admin
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-6 w-full flex-grow">
        
        <!-- Pestañas de Navegación del Cliente -->
        <div id="client-view">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 mb-6">
                <h2 class="text-lg font-semibold text-slate-900 mb-1">Reserva tu cita</h2>
                <p class="text-sm text-slate-500 mb-6">Selecciona el servicio y el horario que mejor te convenga.</p>

                <!-- Formulario de Reserva -->
                <form id="booking-form" onsubmit="handleBooking(event)" class="space-y-6">
                    
                    <!-- 1. Selección de Servicio -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">1. Elige tu servicio principal</label>
                        <div id="services-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <!-- Se rellena con JS -->
                        </div>
                    </div>

                    <!-- 2. Selección de Extras -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">2. Añade extras (opcional)</label>
                        <div id="extras-container" class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                            <!-- Se rellena con JS -->
                        </div>
                    </div>

                    <!-- 3. Fecha y Hora -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">3. Fecha</label>
                            <input type="date" id="booking-date" required onchange="fetchAvailableSlots()" 
                                class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-500 text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">4. Hora disponible</label>
                            <select id="booking-time" required class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-500 text-sm bg-white">
                                <option value="">Selecciona fecha primero...</option>
                            </select>
                        </div>
                    </div>

                    <!-- 5. Datos Personales -->
                    <div class="border-t border-slate-100 pt-4 space-y-4">
                        <h3 class="text-sm font-medium text-slate-700">Tus datos de contacto</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                            <input type="text" id="client-name" placeholder="Nombre" required class="px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pink-500">
                            <input type="text" id="client-surname" placeholder="Apellidos" required class="px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pink-500">
                            <input type="tel" id="client-phone" placeholder="Teléfono (Móvil)" required class="px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pink-500">
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-medium py-3 rounded-xl transition shadow-sm text-sm">
                        Confirmar Reserva
                    </button>
                </form>
            </div>
        </div>

    </main>

    <!-- Modal Admin -->
    <div id="admin-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-2xl w-full p-6 max-h-[90vh] overflow-y-auto shadow-xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-slate-900">Panel de Administración</h3>
                <button onclick="toggleAdminModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <div id="admin-content" class="space-y-6">
                <div>
                    <h4 class="text-sm font-semibold text-slate-700 mb-3">Citas Registradas</h4>
                    <div id="admin-appointments-list" class="space-y-2">
                        <!-- Se llena con JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-slate-400 border-t border-slate-100">
        LedesmaNails &copy; 2026 - Todos los derechos reservados.
    </footer>

    <!-- Lógica de la Aplicación en JavaScript -->
    <script>
        let appData = {};

        async function loadData() {
            const res = await fetch('/api/data');
            appData = await res.json();
            renderClientInterface();
        }

        function renderClientInterface() {
            // Renderizar servicios
            const servicesContainer = document.getElementById('services-container');
            servicesContainer.innerHTML = appData.services.map(s => `
                <label class="border border-slate-200 rounded-xl p-3 flex flex-col justify-between cursor-pointer hover:border-pink-500 transition relative">
                    <input type="radio" name="service" value="${s.id}" required class="absolute top-3 right-3 text-pink-600 focus:ring-pink-500" onchange="calculateTotalDuration()">
                    <div>
                        <span class="font-semibold text-sm text-slate-900 block">${s.name}</span>
                        <span class="text-xs text-slate-500 block mt-1">${s.desc}</span>
                    </div>
                    <div class="mt-3 flex justify-between items-center text-xs font-medium text-slate-600">
                        <span><i class="fa-regular fa-clock mr-1"></i>${s.duration} min</span>
                        <span class="text-pink-600 font-bold">${s.price.toFixed(2)} €</span>
                    </div>
                </label>
            `).join('');

            // Renderizar extras
            const extrasContainer = document.getElementById('extras-container');
            extrasContainer.innerHTML = appData.extras.map(e => `
                <label class="border border-slate-200 rounded-xl p-2.5 flex items-center gap-2 cursor-pointer hover:border-pink-500 transition text-xs">
                    <input type="checkbox" name="extra" value="${e.id}" class="text-pink-600 rounded focus:ring-pink-500">
                    <div class="flex-grow">
                        <span class="font-medium text-slate-800 block">${e.name}</span>
                        <span class="text-pink-600 font-semibold">+${e.price.toFixed(2)} €</span>
                    </div>
                </label>
            `).join('');

            // Establecer fecha mínima a hoy por defecto
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('booking-date').value = today;
            fetchAvailableSlots();
        }

        function getSelectedDuration() {
            const selectedServiceRadio = document.querySelector('input[name="service"]:checked');
            if (!selectedServiceRadio) return 60;
            const serviceId = parseInt(selectedServiceRadio.value);
            const service = appData.services.find(s => s.id === serviceId);
            return service ? service.duration : 60;
        }

        async function fetchAvailableSlots() {
            const date = document.getElementById('booking-date').value;
            if (!date) return;
            const duration = getSelectedDuration();

            const res = await fetch('/api/slots', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ date, duration })
            });
            const data = await res.json();
            const timeSelect = document.getElementById('booking-time');
            
            if (data.slots.length === 0) {
                timeSelect.innerHTML = '<option value="">No hay huecos disponibles</option>';
            } else {
                timeSelect.innerHTML = data.slots.map(slot => `<option value="${slot}">${slot}</option>`).join('');
            }
        }

        async function handleBooking(e) {
            e.preventDefault();
            const serviceId = document.querySelector('input[name="service"]:checked').value;
            const extraIds = Array.from(document.querySelectorAll('input[name="extra"]:checked')).map(el => el.value);
            const date = document.getElementById('booking-date').value;
            const time = document.getElementById('booking-time').value;
            const name = document.getElementById('client-name').value;
            const surname = document.getElementById('client-surname').value;
            const phone = document.getElementById('client-phone').value;

            const res = await fetch('/api/book', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ service_id: serviceId, extra_ids: extraIds, date, time, name, surname, phone })
            });
            const data = await res.json();
            if (data.success) {
                alert('¡Cita solicitada con éxito! Te avisaremos cuando esté confirmada.');
                location.reload();
            } else {
                alert('Hubo un error al reservar.');
            }
        }

        function toggleAdminModal() {
            const modal = document.getElementById('admin-modal');
            modal.classList.toggle('hidden');
            modal.classList.toggle('flex');
            renderAdminAppointments();
        }

        function renderAdminAppointments() {
            const list = document.getElementById('admin-appointments-list');
            list.innerHTML = appData.appointments.map(a => `
                <div class="border border-slate-100 rounded-xl p-3 flex justify-between items-center text-xs">
                    <div>
                        <span class="font-bold text-slate-900 block">${a.client_name} (${a.client_phone})</span>
                        <span class="text-slate-500 block">${a.service_name} - ${a.date} a las ${a.start_time}</span>
                    </div>
                    <span class="px-2 py-1 bg-amber-50 text-amber-700 font-semibold rounded-lg">${a.status}</span>
                </div>
            `).join('');
        }

        window.onload = loadData;
    </script>
</body>
</html>
